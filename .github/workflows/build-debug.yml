name: 构建 Debug APK（自用）

# 只编 debug 包，不依赖任何签名 Secrets。
# debug 包由 AGP 自动生成的调试证书签名，可以直接安装；因为签名与官方不同，
# 需要先卸载原版（会清掉 Eta 的记忆、技能与授权）或做系统级替换。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/Eta-v*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
